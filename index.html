<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мелок — винный бар во дворе на Кави Наджми, Казань</title>
<meta name="description" content="Мелок — винный бар во дворе на улице Кави Наджми в центре Казани, в двух шагах от Баумана.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Golos+Text:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fff;
    --ink: #1b1716;
    --text: #2c2827;
    --muted: #7a7674;
    --line: rgba(27, 23, 22, .22);
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 400 16px/1.55 "Golos Text", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: inherit; }
  /* Шрифты — две роли.
     1) .hand — всё «написанное от руки»: название, заголовки, фразы, кнопки, подписи на карте. Одно начертание.
     2) .cap  — мелкие служебные подписи: капсом вразрядку, один размер и вес на всю страницу. */
  .hand { font-family: "Caveat", "Segoe Print", cursive; font-weight: 700; color: var(--ink); line-height: 1; }
  .cap { margin: 0; font: 500 13px/1.3 "Golos Text", system-ui, sans-serif; letter-spacing: .28em; text-transform: uppercase; color: var(--muted); padding-left: .28em; }

  /* первый экран: афиша — кот — карта */
  .hero {
    position: relative; min-height: 100svh; padding: 40px clamp(20px, 3.5vw, 48px) 54px;
    display: grid; grid-template-columns: minmax(270px, 380px) minmax(0, 1fr) minmax(270px, 380px); /* боковые колонки равной ширины — иначе центр уезжает */
    gap: clamp(20px, 3vw, 48px); align-items: center; justify-content: center;
    max-width: 1500px; margin-inline: auto;
  }
  .center { text-align: center; display: grid; justify-items: center; }
  .stage { width: min(600px, 100%, 56svh); }
  #cat { display: block; width: 100%; aspect-ratio: 720 / 520; filter: invert(1); mix-blend-mode: multiply; cursor: pointer; }
  h1 { margin: -3.5svh 0 0; font-size: clamp(72px, min(11vw, 16svh), 138px); transform: translateX(-.06em) rotate(-3deg); /* сдвиг: у рукописного шрифта буквы смещены вправо от своей рамки */ }
  .kind { margin-top: 12px; }
  .lead { margin: 14px 0 0; max-width: 30ch; font-size: clamp(23px, 2.2vw, 28px); line-height: 1.12; }
  .actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 22px; }
  /* кнопки нарисованы той же линией: неровный овал от руки, подпись рукописным шрифтом */
  .btn {
    position: relative; isolation: isolate; display: inline-block; padding: 7px 28px 10px; text-decoration: none;
    font: 700 28px/1 "Caveat", "Segoe Print", cursive; color: var(--ink); transition: color .2s, transform .15s;
  }
  .btn::before {
    content: ""; position: absolute; inset: 0; z-index: -1; background: #fff;
    border: 2.6px solid var(--ink); border-radius: 255px 22px 225px 20px / 20px 225px 24px 255px;
    filter: url(#hand); transition: background .2s, rotate .2s;
  }
  .btn.fill { color: #fff; }
  .btn.fill::before { background: var(--ink); }
  .btn:hover::before, .btn:focus-visible::before { rotate: -1.2deg; background: var(--ink); }
  .btn:hover, .btn:focus-visible { color: #fff; outline: none; }
  .btn.fill:hover::before, .btn.fill:focus-visible::before { background: #fff; }
  .btn.fill:hover, .btn.fill:focus-visible { color: var(--ink); }
  .btn:active { transform: scale(.96); }
  .only-m { display: none; }

  /* плавающее меню-«облако» */
  .float {
    position: fixed; z-index: 20; top: 12px; left: 50%; translate: -50% -160%; opacity: 0; pointer-events: none;
    display: none; gap: 2px; padding: 5px; white-space: nowrap; border-radius: 999px;
    background: rgba(255, 255, 255, .88); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    border: 1px solid var(--line); box-shadow: 0 14px 30px -14px rgba(0, 0, 0, .4), 0 2px 6px rgba(0, 0, 0, .06);
    transition: translate .3s cubic-bezier(.2, .8, .2, 1), opacity .2s;
  }
  .float.on { translate: -50% 0; opacity: 1; pointer-events: auto; }
  .float a { padding: 6px 14px 8px; border-radius: 999px; font: 700 22px/1 "Caveat", "Segoe Print", cursive; text-decoration: none; color: var(--ink); }
  .float a:active { background: var(--ink); color: #fff; }
  #afisha, #map { scroll-margin-top: 76px; }

  /* афиша — лист бумаги, нарисованный той же линией, что кот и карта: волнистые края, закрученный уголок, скотч */
  .poster {
    position: relative; rotate: 2.2deg; width: 100%; max-width: 310px; justify-self: center;
    filter: drop-shadow(0 9px 9px rgba(0, 0, 0, .09));
  }
  .poster .paper { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .poster .sheet { position: relative; text-align: center; padding: 52px 30px 50px; }
  .poster .glass { display: block; width: 62px; height: auto; margin: 16px auto 10px; }
  .poster .when { color: var(--ink); }
  .poster h2 { margin: 8px 0 0; font-size: clamp(46px, 4.4vw, 60px); line-height: .95; text-wrap: balance; }
  .poster .note { margin: 12px auto 0; max-width: 22ch; font-size: 23px; line-height: 1.12; text-wrap: pretty; }

  /* карта — нарисована прямо на странице, без листка */
  .map h2 { margin: 0; font-size: 44px; text-align: center; }
  .map svg { display: block; width: 100%; height: auto; margin-top: 10px; }
  .map svg text { font-family: "Caveat", cursive; font-weight: 700; fill: var(--ink); }
  .map p { margin: 8px 4px 0; font-size: 22px; line-height: 1.12; text-align: center; text-wrap: balance; }

  .legal { position: absolute; inset: auto 0 14px 0; margin: 0; padding: 0 20px; text-align: center; font-size: 12px; color: var(--muted); opacity: .8; }

  @media (max-width: 1080px) {
    .hero { grid-template-columns: repeat(2, minmax(0, 360px)); padding-top: 0; padding-bottom: 76px; row-gap: 44px; }
    .center { grid-column: 1 / -1; order: -1; min-height: 100svh; align-content: center; padding-block: 24px; } /* блок с котом — ровно на весь первый экран */
    .stage { width: min(560px, 100%, 50svh); }
    .poster, .map { align-self: start; }
    .map { order: 1; }
    .legal { order: 2; }
    .only-m { display: inline-block; }
    .float { display: flex; }
  }
  @media (max-width: 680px) {
    .hero { grid-template-columns: minmax(0, 400px); }
    .legal { position: static; grid-column: 1 / -1; padding: 0; }
    .actions { flex-wrap: nowrap; gap: 8px; }
    .btn { padding: 6px 16px 9px; font-size: 24px; white-space: nowrap; }
  }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } .float { transition: none; } }
</style>
</head>
<body>


<!-- плавающее меню: появляется на узких экранах, когда блок с котом ушёл из вида -->
<nav class="float" id="float" aria-label="Быстрая навигация">

        <!-- Кави Наджми, 8а -->
        <path d="M567 534.8 L536 576.3 L568.7 604.6 L626.6 651.7 L558.7 732.2 L583.7 752.9 L630 698 L656.6 720.2 L709.9 657 L613.4 574.4 Z" fill="#fff" stroke-width="5"/>

      <!-- ул. Баумана — пешеходная, кусочек в углу -->

      <g stroke="#fff" stroke-linejoin="round" paint-order="stroke" text-anchor="middle">
        <text transform="translate(472 474) rotate(-52.6)" font-size="30" stroke-width="9">ул. Кави Наджми</text>

    <p class="hand">Кави Наджми, 8а. С улицы сворачивайте во двор у дома 8 — мы внутри.</p>
  </aside>

  <section class="center">
    <div class="stage">
      <canvas id="cat" role="img" aria-label="Нарисованный котёнок встаёт и трётся о бутылку красного вина" title="Нажмите на кота"></canvas>
    </div>
    <h1 class="hand">Мелок</h1>
    <p class="cap kind">винный бар</p>

  <!-- афиша: одно ближайшее событие; позже его будет отдавать админка, см. MELOK_EVENT внизу -->
  <aside class="poster" id="afisha" aria-labelledby="afisha-h">
   <svg class="paper" viewBox="0 0 300 400" preserveAspectRatio="none" aria-hidden="true">
     <defs>
       <pattern id="ph" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(-38)">

    <p class="cap when" id="ev-when"></p>
    <h2 class="hand" id="afisha-h"></h2>
    <p class="hand note" id="ev-note"></p>

  </aside>

  <p class="legal">18+ · Чрезмерное употребление алкоголя вредит вашему здоровью</p>
</main>

<script>
  // Афиша — одно ближайшее событие. Сейчас оно задано здесь; когда появится админка, она будет отдавать такой же объект.
  // Пустой объект или null — плакат покажет «скоро новые анонсы».
  window.MELOK_EVENT = {
    when: 'пятница · 19:00',
    what: 'Слепая дегустация',
    note: 'Шесть вин без этикеток. Пробуем, спорим, угадываем сорт и страну.'
  };
  (function () {
    const e = window.MELOK_EVENT || {}, set = (id, v) => { const el = document.getElementById(id); if (v) el.textContent = v; else el.remove(); };
    set('ev-when', e.what ? e.when : '');
    set('afisha-h', e.what || 'Скоро новые анонсы');
    set('ev-note', e.what ? e.note : 'А пока — заходите на бокал.');
  })();
</script>
<script>
  // плавающее меню показывается, когда блок с котом и кнопками полностью ушёл за край экрана
  (function () {
    const nav = document.getElementById('float'), hero = document.querySelector('.center');
    if (!nav || !hero || !('IntersectionObserver' in window)) return;
    new IntersectionObserver(([e]) => nav.classList.toggle('on', !e.isIntersecting)).observe(hero);
  })();
</script>
<script src="cat.js?v=8"></script>
</body>
</html>
